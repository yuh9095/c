name: Droidspaces Linux integration

on:
  push:
    branches:
      - bootstrap/project-skeleton
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an active container test: it owns a nested PID namespace.
concurrency:
  group: droidspaces-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  droidspaces-linux:
    # This runner must be installed INSIDE the Droidspaces Linux container.
    # Keep the default self-hosted/linux/ARM64 labels and add droidspaces.
    runs-on: [self-hosted, linux, ARM64, droidspaces]
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Verify Droidspaces Linux runner
        run: |
          set -Eeuo pipefail

          echo '=== Architecture ==='
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "Expected ARM64, got: $(uname -m)" >&2; exit 1 ;;
          esac

          echo '=== Linux environment ==='
          test -r /proc/1/comm
          test -r /proc/self/status
          cat /etc/os-release || true
          uname -a
          printf 'PID 1: '
          cat /proc/1/comm
          printf 'PID namespace: '
          readlink /proc/self/ns/pid
          printf 'Mount namespace: '
          readlink /proc/self/ns/mnt
          id

          echo '=== Required tools ==='
          for tool in cmake ninja gcc git unshare ctest; do
            command -v "$tool"
          done

      - name: Verify nested namespace permissions
        run: |
          set -Eeuo pipefail

          # The integration test needs a real nested mount + PID namespace.
          # Try the container's normal namespace permissions first, then the
          # rootless user-namespace route. Never silently skip this check.
          if unshare --kill-child --mount --pid --fork --mount-proc true; then
            echo 'Nested PID/mount namespace: direct mode available'
          elif unshare --kill-child --user --map-root-user --mount --pid --fork --mount-proc true; then
            echo 'Nested PID/mount namespace: rootless user namespace available'
          else
            echo 'Droidspaces does not permit the nested namespaces required by this test.' >&2
            echo 'Enable nested PID/mount namespaces for this Linux container.' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run complete test suite
        env:
          NINIT_REQUIRE_PID_NAMESPACE_TEST: "1"
        run: ctest --test-dir build --output-on-failure --timeout 60

      - name: Show test inventory
        if: always()
        run: ctest --test-dir build --show-only
