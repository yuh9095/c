name: Droidspaces Linux container integration

on:
  push:
    branches:
      - bootstrap/project-skeleton
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: droidspaces-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  droidspaces-linux:
    # Use an ordinary ephemeral GitHub-hosted Linux VM. Droidspaces itself
    # creates the test container on this runner; no self-hosted runner needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build debootstrap \
            curl ca-certificates xz-utils util-linux

      - name: Install Droidspaces Linux backend
        env:
          DROIDSPACES_VERSION: "7.2.0"
          DROIDSPACES_COMMIT: "cdadb9eb"
        run: |
          set -Eeuo pipefail
          archive="droidspaces-v${DROIDSPACES_VERSION}-${DROIDSPACES_COMMIT}.tar.gz"
          base="https://github.com/ravindu644/Droidspaces-OSS/releases/download/v${DROIDSPACES_VERSION}"

          curl --fail --show-error --location --retry 3 \
            "${base}/${archive}" -o "${archive}"
          curl --fail --show-error --location --retry 3 \
            "${base}/SHA256SUMS" -o SHA256SUMS
          grep "  ${archive}$" SHA256SUMS | sha256sum --check -

          tar -xzf "${archive}"
          binary="$(find . -type f -path '*/x86_64/droidspaces' -print -quit)"
          test -n "$binary"
          sudo install -D -m 0755 "$binary" /usr/local/bin/droidspaces

          sudo droidspaces version
          sudo droidspaces check

      - name: Build Ninit
        run: |
          set -Eeuo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2

      - name: Boot Ninit inside a real Droidspaces container and test
        env:
          ROOTFS: ${{ runner.temp }}/ninit-droidspaces-rootfs
          CONTAINER_NAME: ninit-ci
        run: |
          set -Eeuo pipefail

          cleanup() {
            sudo droidspaces --name="$CONTAINER_NAME" stop >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Create a clean Ubuntu rootfs on the GitHub-hosted Linux VM.
          sudo debootstrap --variant=minbase noble "$ROOTFS" \
            http://archive.ubuntu.com/ubuntu

          # Install the just-built Ninit binaries into the container rootfs.
          sudo cmake --install build --prefix "$ROOTFS/usr"
          sudo mkdir -p "$ROOTFS/etc/ninit/units"
          sudo ln -sfn /usr/bin/ninit-init "$ROOTFS/sbin/init"

          # Supply the three boot-coordinator targets as native Ninit units.
          for target in sysinit boot default; do
            sudo tee "$ROOTFS/etc/ninit/units/$target.target" >/dev/null <<EOF
          [Unit]
          Description=Ninit CI $target target
          [Target]
          EOF
          done

          # Start the actual Droidspaces Linux container with Ninit as PID 1.
          sudo droidspaces \
            --name="$CONTAINER_NAME" \
            --rootfs="$ROOTFS" \
            --net=host \
            --bind-mount="$GITHUB_WORKSPACE:/workspace" \
            --volatile \
            start

          # Verify that Droidspaces booted our init, not a shell or systemd.
          sudo droidspaces --name="$CONTAINER_NAME" run sh -ec '
            printf "Container PID 1: "
            cat /proc/1/comm
            test "$(cat /proc/1/comm)" = "ninit-init"
            test -x /workspace/build/ninit-manager
          '

          # Install only the test runner and namespace utilities in the guest.
          sudo droidspaces --name="$CONTAINER_NAME" run apt-get update
          sudo droidspaces --name="$CONTAINER_NAME" run \
            apt-get install -y --no-install-recommends cmake util-linux

          # Run CTest from inside the Droidspaces container. The mandatory
          # namespace test must execute; it may not be reported as SKIPPED.
          sudo droidspaces --name="$CONTAINER_NAME" run \
            env NINIT_REQUIRE_PID_NAMESPACE_TEST=1 \
            ctest --test-dir /workspace/build --output-on-failure --timeout 60

          echo "Droidspaces container test completed successfully."

      - name: Show host and container diagnostics
        if: always()
        run: |
          set +e
          uname -a
          sudo droidspaces show
          sudo droidspaces --name=ninit-ci info
