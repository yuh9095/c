name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential
          if [ "${{ matrix.libc }}" = "musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Configure
        run: |
          if [ "${{ matrix.libc }}" = "musl" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=musl-gcc
          else
            cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc
          fi

      - name: Build
        run: cmake --build build

      - name: Test unit suite
        run: ctest --test-dir build --output-on-failure -L unit --timeout 30

      - name: Test component suite
        run: ctest --test-dir build --output-on-failure -L component --timeout 30

      - name: Test namespace integration suite
        run: ctest --test-dir build --output-on-failure -L integration --timeout 60

  asan:
    name: AddressSanitizer (glibc)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure with AddressSanitizer
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNINIT_ENABLE_ASAN=ON

      - name: Build instrumented binaries and tests
        run: cmake --build build-asan --parallel 2

      - name: Run tests under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
        run: |
          ctest --test-dir build-asan --output-on-failure -L unit --timeout 30
          ctest --test-dir build-asan --output-on-failure -L component --timeout 30
          ctest --test-dir build-asan --output-on-failure -L integration --timeout 60
